services:
  career-ops:
    build:
      context: .
      additional_contexts:
        browser-harness: ${CAREER_OPS_BROWSER_HARNESS_SOURCE:-../browser-harness}
    image: career-ops:local
    ports:
      - "127.0.0.1:${CAREER_OPS_WEB_PORT:-3010}:3000"
      - "127.0.0.1:${CAREER_OPS_DESKTOP_PORT:-6080}:6080"
    volumes:
      - ${CAREER_OPS_DATA_SOURCE:-career-ops-data}:${CAREER_OPS_CONTAINER_DATA_ROOT:-/data}
      - career-ops-home:/home/node
    environment:
      CAREER_OPS_ROOT: ${CAREER_OPS_CONTAINER_DATA_ROOT:-/data}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Add account-specific secretEnv names through a private Compose override.
    shm_size: "1gb"
    # Allow Chromium's user-namespace sandbox without privileged mode/SYS_ADMIN.
    security_opt:
      - seccomp=./container/chromium-seccomp.json
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  career-ops-data:
  career-ops-home:
