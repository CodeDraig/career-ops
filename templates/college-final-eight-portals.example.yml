# Five recovered school routes, 2026-10-19. Example only; not auto-loaded.
# Chrome extension setup and scopes: docs/COLLEGE_FINAL_EIGHT_VALIDATION.md.
tracked_companies:
  # UNITID 113980: El Camino academic and part-time instructor board; classified staff is outside this route
  - name: El Camino College academic board
    provider: local-parser
    careers_url: https://elcamino.igreentree.com/CSS_Academic/
    enabled: true
    parser:
      command: node
      script: browser-job-search.mjs
      args:
        - --url
        - '{careers_url}'
        - --company
        - '{company}'
        - --kind
        - igreentree
      timeout_ms: 600000
      max_buffer_bytes: 10000000
  # UNITID 156471: Shared Galen College of Nursing board, all campuses; not Louisville-only
  - name: Galen College of Nursing (all campuses)
    provider: local-parser
    careers_url: https://careers.hcahealthcare.com/search/galen-college-of-nursing/jobs
    enabled: true
    parser:
